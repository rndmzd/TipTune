name: CI

permissions:
  contents: read

on:
  #push:
  #  branches:
  #    - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          #- ubuntu-22.04
          - windows-latest
          #- macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Python sanity check (compile)
        run: |
          python -m compileall -q .

      - name: Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Embedded player and audio routing regression tests
        run: node --test tests/audio-output.test.mjs tests/spotify-player.test.mjs

      - name: Windows release signing regression tests
        if: runner.os == 'Windows'
        run: ./tests/windows-signing.Tests.ps1

      - name: Fetch pinned artifact client for signing runtime check
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
          path: .signing-tools/upload-artifact
          persist-credentials: false

      - name: Verify signing artifact handoff in a real Actions runtime
        if: runner.os == 'Windows'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const result = spawnSync('pwsh', ['-NoLogo', '-NoProfile', '-File',
              'tests/windows-signing-runtime.ps1'], { stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) core.setFailed('Signing runtime handoff failed');

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch playback binaries (ffmpeg, yt-dlp, Deno)
        run: node scripts/fetch-binaries.mjs

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Build desktop app (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node node_modules/@tauri-apps/cli/tauri.js build -- --locked

      - name: Verify Windows bundle metadata
        if: runner.os == 'Windows'
        run: python scripts/check-bundle-metadata.py --bundle-dir src-tauri/target/release/bundle

      - name: Verify private source maps and distributed assets
        run: npm run sentry:verify

      - name: Native process lifecycle regression tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test windows_lifecycle

      - name: Native error reporting regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib error_reporting

      - name: Packaged backend lifecycle regression tests
        if: runner.os == 'Windows'
        run: python scripts/check-packaged-lifecycle.py --backend src-tauri/binaries/TipTune-x86_64-pc-windows-msvc.exe
